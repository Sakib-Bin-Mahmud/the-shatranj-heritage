[project]
name = "shatranj-heritage-api"
version = "0.1.0"
description = "The Shatranj Heritage — backend API (modular monolith)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic's own revision template doesn't follow our lint/format rules
# (e.g. `Union[..., None]` instead of `X | Y`), and we don't hand-edit
# that boilerplate — only the upgrade()/downgrade() bodies matter.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
