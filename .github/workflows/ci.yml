name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, test, openapi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shatranj
          POSTGRES_PASSWORD: shatranj
          POSTGRES_DB: shatranj_heritage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shatranj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shatranj:shatranj@localhost:5432/shatranj_heritage
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Export OpenAPI schema
        run: |
          python -c "
          import json
          from app.main import app
          json.dump(app.openapi(), open('openapi.json', 'w'), indent=2)
          "

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: apps/api/openapi.json

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright golden paths)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shatranj
          POSTGRES_PASSWORD: shatranj
          POSTGRES_DB: shatranj_heritage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shatranj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shatranj:shatranj@localhost:5432/shatranj_heritage
      REDIS_URL: redis://localhost:6379/0
      ADMIN_E2E_EMAIL: e2e-admin@example.com
      ADMIN_E2E_PASSWORD: Passw0rd1234
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt

      - name: Apply Alembic migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Bootstrap E2E admin account
        working-directory: apps/api
        run: |
          python -m scripts.create_admin_user \
            --email "$ADMIN_E2E_EMAIL" \
            --password "$ADMIN_E2E_PASSWORD" \
            --full-name "E2E Admin"

      - name: Start API server
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          npx --yes wait-on@7 -t 60000 http://localhost:8000/docs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build web app
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start web server
        working-directory: apps/web
        run: |
          nohup npm run start > web.log 2>&1 &
          npx --yes wait-on@7 -t 60000 http://localhost:3000

      - name: Run Playwright E2E suite
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            apps/api/api.log
            apps/web/web.log
          retention-days: 7
